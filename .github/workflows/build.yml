name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Compilar
        run: |
          set -o pipefail
          {
            npm ci &&
            npm test &&
            npm run build &&
            npx cap sync android &&
            cd android && chmod +x gradlew &&
            ./gradlew assembleRelease --no-daemon --stacktrace
          } 2>&1 | tee build.log

      - name: Preparar APK
        run: cp android/app/build/outputs/apk/release/app-release.apk pesagem-pv.apk

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pesagem PV 1.0.${{ github.run_number }}
          body: |
            Baixe o arquivo **pesagem-pv.apk** abaixo pelo celular e toque nele para instalar.
            Versão gerada a partir do commit ${{ github.sha }}.
          files: pesagem-pv.apk
          make_latest: true

      # Se falhar, guarda o log num branch para diagnóstico
      - name: Salvar log de falha
        if: failure()
        run: |
          tail -n 500 build.log > /tmp/build-log.txt 2>/dev/null || echo "sem log" > /tmp/build-log.txt
          git config user.name "build"
          git config user.email "build@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf --cached . > /dev/null
          cp /tmp/build-log.txt build-log.txt
          git add -f build-log.txt
          git commit -m "log de falha ${{ github.sha }}"
          git push -f origin build-log
